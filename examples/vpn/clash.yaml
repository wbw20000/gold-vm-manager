# Gold VM Manager · Clash / Mihomo 本地节点空模板
# 1. 把此文件复制到仓库之外，另存为 clash.local.yaml。不要提交填写后的副本。
# 2. 将 proxies: [] 改成 proxies:，把对应协议的一个注释块移到其下，
#    去掉各行开头的「# 」，保留缩进。所有示例均未启用，地址和凭据均为占位符。
# 3. 按服务商资料替换测试地址、整数端口、凭据和 TLS 名称，不要关闭证书校验。
#    优先填写公网 IPv4；使用节点域名时，需在界面单独同意解析。
# 4. 在「新建 VM 及预装软件」里输入填写后的本机绝对路径并校验。
#    也可勾选「先不配置 VPN」，恢复系统后再填路径。
# 不提交订阅链接、完整客户端配置、DNS、路由或 provider。

proxies: []

