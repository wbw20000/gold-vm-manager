name: Update Max calendar days

on:
  schedule:
    - cron: '11 16 * * *' # 00:11 the next day in Singapore (UTC+8)
  workflow_dispatch:

permissions: {}

jobs:
  update:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: update-usage-days-default-branch
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Calculate Singapore calendar day
        run: python3 -I tools/update_usage_days.py
      - name: Publish only changed READMEs
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md README.en.md; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit --only -m 'docs: update Max calendar day' -- README.md README.en.md
          git push origin "HEAD:$GITHUB_REF"
